<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room 204 & 202 &#8212; Booking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f4;
      --text: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #888780;
      --border: rgba(0,0,0,0.12);
      --border-secondary: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-bg: #E1F5EE;
      --red: #E24B4A;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --amber: #BA7517;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #282825;
        --text: #f0efe8;
        --text-secondary: #b4b2a9;
        --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12);
        --border-secondary: rgba(255,255,255,0.22);
        --green-bg: #04342c;
        --red-bg: #501313;
        --red-text: #F09595;
        --amber: #EF9F27;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 760px; margin: 0 auto; }

    /* Profile screen */
    .name-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .name-card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 360px;
    }
    .name-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
    .name-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.5; }
    .name-card label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    .name-card input {
      width: 100%; padding: 9px 12px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary); background: var(--bg);
      color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 12px;
    }
    .name-card input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.2); }
    .name-card button {
      width: 100%; padding: 10px; border-radius: var(--radius-md);
      border: none; background: var(--green); color: white;
      font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
    }
    .name-card button:hover { background: var(--green-dark); }
    .name-card button.secondary {
      background: transparent; color: var(--text-secondary); margin-top: 8px;
    }
    .name-card button.secondary:hover { background: var(--bg-secondary); }

    /* Setup screen */
    .setup-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .setup-card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 480px;
    }
    .setup-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    .setup-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; }
    .setup-step { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .setup-step strong { color: var(--text); font-weight: 500; }

    /* Main app */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 12px;
    }
    .app-title { font-size: 18px; font-weight: 500; }

    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-pill {
      font-size: 12px; color: var(--text-secondary); background: var(--bg);
      border: 0.5px solid var(--border); border-radius: 99px; padding: 4px 12px;
      cursor: pointer;
    }
    .user-pill:hover { border-color: var(--border-secondary); }

    .nav { display: flex; align-items: center; gap: 10px; }
    .nav button {
      border: 0.5px solid var(--border-secondary); background: var(--bg);
      border-radius: var(--radius-md); padding: 6px 14px; cursor: pointer;
      color: var(--text); font-size: 14px; font-family: inherit;
    }
    .nav button:hover { background: var(--bg-secondary); }
    .week-label { font-size: 14px; font-weight: 500; min-width: 150px; text-align: center; }

    /* Room switcher with live status */
    .rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
    .room-tab {
      background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
      padding: 12px 14px; cursor: pointer; text-align: left; font-family: inherit; color: var(--text);
      min-width: 0;
    }
    .room-tab:hover { border-color: var(--border-secondary); }
    .room-tab.active { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .room-tab-top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .status-dot.busy { background: var(--red); }
    .room-status {
      font-size: 12px; color: var(--text-secondary); margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .calendar {
      border: 0.5px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; background: var(--bg);
    }
    .cal-head { display: grid; grid-template-columns: 56px repeat(5, 1fr); border-bottom: 0.5px solid var(--border); }
    .cal-head-cell {
      padding: 10px 8px; text-align: center; font-size: 12px;
      color: var(--text-secondary); font-weight: 500; border-right: 0.5px solid var(--border);
    }
    .cal-head-cell:last-child { border-right: none; }
    .cal-head-cell.today { color: var(--green); }
    .cal-head-cell .dn { font-size: 20px; font-weight: 500; display: block; color: var(--text); }
    .cal-head-cell.today .dn { color: var(--green); }

    .cal-body { display: grid; grid-template-columns: 56px repeat(5, 1fr); }
    .time-col { display: flex; flex-direction: column; }
    .time-cell {
      height: 22px; display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 3px 8px 0 0; font-size: 11px; color: var(--text-tertiary);
      border-bottom: 0.5px solid var(--border); border-right: 0.5px solid var(--border);
    }
    .time-cell.qtr, .slot.qtr { border-bottom-color: transparent; }

    .day-col { position: relative; border-right: 0.5px solid var(--border); min-width: 0; }
    .day-col:last-child { border-right: none; }

    .slot {
      height: 22px; border-bottom: 0.5px solid var(--border);
      cursor: pointer; position: relative; transition: background 0.1s;
    }
    .slot:hover { background: var(--bg-secondary); }
    .slot.booked { cursor: default; }
    .slot:not(.booked):hover::after {
      content: "+"; position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%); font-size: 15px; color: var(--green); opacity: 0.6;
    }

    .booking {
      position: absolute; left: 2px; right: 2px; border-radius: 6px;
      padding: 3px 6px; z-index: 2; overflow: hidden; cursor: pointer;
    }
    .booking.short { padding-top: 1px; padding-bottom: 1px; }
    .booking.past { opacity: 0.55; }
    .booking-title { font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .booking-meta { font-size: 10px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .now-line {
      position: absolute; left: 0; right: 0; height: 2px; background: var(--red);
      z-index: 3; pointer-events: none;
    }
    .now-line::before {
      content: ""; position: absolute; left: -4px; top: -3px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--red);
    }

    .legend {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-top: 12px; font-size: 12px; color: var(--text-secondary);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--green-bg); border: 1px solid var(--green); }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal {
      background: var(--bg); border-radius: var(--radius-lg);
      border: 0.5px solid var(--border); padding: 1.5rem;
      width: 100%; max-width: 340px;
    }
    .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; word-break: break-word; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 8px 10px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary); background: var(--bg);
      color: var(--text); font-size: 14px; font-family: inherit;
    }
    .field input:focus, .field select:focus {
      outline: none; border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.2);
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; flex-wrap: wrap; }
    .modal-actions button {
      flex: 1; padding: 9px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary); cursor: pointer;
      font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text);
    }
    .modal-actions button:hover { background: var(--bg-secondary); }
    .btn-confirm { background: var(--green) !important; border-color: var(--green) !important; color: white !important; font-weight: 500; }
    .btn-confirm:hover { background: var(--green-dark) !important; }
    .btn-delete { border-color: var(--red) !important; color: var(--red-text) !important; }
    .btn-delete:hover { background: var(--red-bg) !important; }
    .error { font-size: 12px; color: var(--red); margin-top: 6px; min-height: 16px; }
    .own-badge {
      font-size: 11px; background: var(--green-bg); color: var(--green-dark);
      border-radius: 4px; padding: 2px 7px; display: inline-block; margin-bottom: 10px;
    }
    .detail { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .detail span { color: var(--text); }
    .banner { border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; }
    .error-banner { background: var(--red-bg); color: var(--red-text); border: 0.5px solid var(--red); }
    .ok-banner { background: var(--green-bg); color: var(--text); border: 0.5px solid var(--green); }
    .modal-actions button:disabled { opacity: 0.6; cursor: default; }
    .hint { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.5; }

    @media (max-width: 520px) {
      body { padding: 1rem; }
      .booking-meta { display: none; }
    }
  </style>
</head>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<div id="root"></div>

<script>
// \u2500\u2500\u2500 Firebase config \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDpKr7x9dSQV4BQ33z8y6tFQTWxIz65aBo",
  authDomain: "booking-86a47.firebaseapp.com",
  databaseURL: "https://booking-86a47-default-rtdb.firebaseio.com",
  projectId: "booking-86a47",
  storageBucket: "booking-86a47.firebasestorage.app",
  messagingSenderId: "521433950401",
  appId: "1:521433950401:web:707b500336c153aa7d0c40"
};
// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

const ROOMS = ['204', '202'];
const DAY_START = 8 * 60;   // 8:00, in minutes
const DAY_END = 18 * 60;    // 18:00
const STEP = 15;            // minutes per slot
const TZ = 'America/Los_Angeles';   // Santa Clara office
const SLOT_H = 22;          // px per slot

const COLORS = [
  { bg: '#E1F5EE', border: '#1D9E75', text: '#085041' },
  { bg: '#E6F1FB', border: '#378ADD', text: '#0C447C' },
  { bg: '#FAEEDA', border: '#EF9F27', text: '#633806' },
  { bg: '#FBEAF0', border: '#D4537E', text: '#72243E' },
  { bg: '#EEEDFE', border: '#7F77DD', text: '#26215C' },
];

const hm = mins => `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')}`;
// LABELS[i] is the time at the start of slot i; the last entry (18:00) is only an end time.
const LABELS = Array.from({ length: (DAY_END - DAY_START) / STEP + 1 }, (_, i) => hm(DAY_START + i * STEP));
const SLOTS = LABELS.length - 1;
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

let db = null;
let bookings = {};
let weekOffset = 0;
let modal = null;
let editingProfile = false;
let room = ROOMS.includes(load('rb_room')) ? load('rb_room') : ROOMS[0];
let profile = (() => {
  try { const p = JSON.parse(load('rb_profile')); if (p) return p; } catch {}
  return { name: load('room208_name') || '' };   // migrate old name-only profile
})();

function isConfigured() {
  return FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.length > 0;
}

// Connection to the booking database. While it's down, bookings only exist in this
// browser tab and nobody else can see them, so we say so loudly.
let connected = false;
let everConnected = false;
let notice = '';

function initFirebase() {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  db.ref('bookings').on('value', snap => {
    bookings = snap.val() || {};
    renderMain();
    if (modal?.type === 'view') renderModal();
  });
  db.ref('.info/connected').on('value', snap => {
    connected = snap.val() === true;
    if (connected) everConnected = true;
    renderMain();
  });
  // Give the first connection a few seconds before warning about it.
  setTimeout(renderMain, 5000);
}

function showNotice(text) {
  notice = text;
  renderMain();
  setTimeout(() => { if (notice === text) { notice = ''; renderMain(); } }, 4000);
}

// Resolves once the server has the write; rejects if it refuses it or takes too long.
function serverWrite(promise, ms = 10000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

// \u2500\u2500 Helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function colorFor(name) {
  let h = 0;
  for (const ch of String(name || '').toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}

// \u2500\u2500 Pacific time \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// Everything runs on Santa Clara time, whatever the viewer's computer clock is set to.
// A calendar day is a Date at UTC midnight, read with getUTC* (it marks a date, not an instant).

const PT_PARTS = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric',
  hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23',
});

function ptParts(ms) {
  const p = {};
  for (const { type, value } of PT_PARTS.formatToParts(ms)) p[type] = Number(value);
  return p;
}

// The instant when Pacific wall-clock reads y-m-d 00:00 plus `mins` minutes.
function ptInstant(y, m, d, mins) {
  const wall = Date.UTC(y, m - 1, d, 0, mins);
  let ms = wall;
  for (let i = 0; i < 2; i++) {   // second pass settles DST changeover days
    const p = ptParts(ms);
    ms += wall - Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  }
  return ms;
}

function ptDay(ms) { const p = ptParts(ms); return new Date(Date.UTC(p.year, p.month - 1, p.day)); }

function getWeekDates(offset) {
  const today = ptDay(Date.now());
  const dow = today.getUTCDay();
  const monday = new Date(today);
  monday.setUTCDate(today.getUTCDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  return Array.from({ length: 5 }, (_, i) => {
    const d = new Date(monday);
    d.setUTCDate(monday.getUTCDate() + i);
    return d;
  });
}

function onDay(day, ms) { return ptDay(ms).getTime() === day.getTime(); }
function samePtDay(a, b) { return ptDay(a).getTime() === ptDay(b).getTime(); }
function isToday(day) { return onDay(day, Date.now()); }

function weekKey(dates) { return dates[0].toISOString().slice(0, 10); }

function slotTime(date, slot) {
  return ptInstant(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate(), DAY_START + slot * STEP);
}

function minsOfDay(ms) { const p = ptParts(ms); return p.hour * 60 + p.minute; }
function fmt(ms) { return new Date(ms).toLocaleTimeString([], { timeZone: TZ, hour: 'numeric', minute: '2-digit' }); }
function timeRange(b) { return `${hm(minsOfDay(b.startAt))} \u2013 ${hm(minsOfDay(b.endAt))}`; }

function roomBookings(r) {
  return Object.entries(bookings)
    .filter(([, b]) => b.room === r && b.startAt && b.endAt)
    .map(([id, b]) => ({ ...b, id }));
}

// Bookings in the shown week, tagged with the weekday column they fall in.
function weekBookings(r, dates) {
  return roomBookings(r)
    .map(b => ({ ...b, col: dates.findIndex(d => onDay(d, b.startAt)) }))
    .filter(b => b.col >= 0);
}

function overlaps(r, startAt, endAt) {
  return roomBookings(r).some(b => startAt < b.endAt && endAt > b.startAt);
}

function isOwn(b) {
  if (b.organizerEmail && profile.email) return b.organizerEmail.toLowerCase() === profile.email.toLowerCase();
  return !!b.organizer && b.organizer.toLowerCase() === profile.name.toLowerCase();
}

// Who has the room right now, or when it's next taken today.
function roomStatus(r, now) {
  const upcoming = roomBookings(r)
    .filter(b => b.endAt > now)
    .sort((a, b) => a.startAt - b.startAt);
  const cur = upcoming.find(b => b.startAt <= now);
  if (cur) return { busy: true, text: `${cur.organizer || 'Someone'} \u00b7 ${cur.title} \u00b7 until ${fmt(cur.endAt)}` };
  const next = upcoming.find(b => samePtDay(b.startAt, now));
  return { busy: false, text: next ? `Free until ${fmt(next.startAt)} (${next.organizer || 'booked'})` : 'Free for the rest of the day' };
}

// \u2500\u2500 Actions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function selectRoom(r) {
  room = r;
  store('rb_room', r);
  renderMain();
}

function openNew(day, slot) {
  modal = { type: 'new', day, startSlot: slot, endSlot: Math.min(slot + 2, SLOTS) };
  renderModal();
}

function openView(id) {
  modal = { type: 'view', id };
  renderModal();
}

function closeModal() { modal = null; renderModal(); }

function confirmBooking() {
  const title = document.getElementById('m-title').value.trim();
  const startSlot = parseInt(document.getElementById('m-start').value);
  const endSlot = parseInt(document.getElementById('m-end').value);
  const errEl = document.getElementById('m-err');
  errEl.textContent = '';

  if (!title) { errEl.textContent = 'Please enter a title.'; return; }
  if (endSlot <= startSlot) { errEl.textContent = 'End time must be after start time.'; return; }

  const dates = getWeekDates(weekOffset);
  const startAt = slotTime(dates[modal.day], startSlot);
  const endAt = slotTime(dates[modal.day], endSlot);

  if (endAt <= Date.now()) { errEl.textContent = 'That time has already passed.'; return; }
  if (!connected) { errEl.textContent = "Can't reach the booking server, so this wouldn't save. Check your internet, VPN or ad blocker, then reload the page."; return; }
  if (overlaps(room, startAt, endAt)) { errEl.textContent = 'That time overlaps an existing booking.'; return; }

  const btn = document.getElementById('m-book');
  btn.disabled = true;
  btn.textContent = 'Saving\u2026';

  const ref = db.ref('bookings').push();
  serverWrite(ref.set({
    room, week: weekKey(dates), day: modal.day, startSlot, endSlot, startAt, endAt, title,
    organizer: profile.name,
    ...(profile.email ? { organizerEmail: profile.email } : {}),
    createdAt: firebase.database.ServerValue.TIMESTAMP,
  })).then(() => {
    closeModal();
    showNotice(`Booked Room ${room}, ${fmt(startAt)} \u2013 ${fmt(endAt)} PT`);
  }).catch(e => {
    ref.remove();   // don't leave an unsaved copy showing on this screen
    btn.disabled = false;
    btn.textContent = 'Book room';
    errEl.textContent = e.message === 'timeout'
      ? "The booking server didn't respond, so this wasn't saved. Check your internet, VPN or ad blocker, then try again."
      : 'Could not save booking: ' + e.message;
  });
}

function deleteBooking(id) {
  const btn = document.getElementById('m-delete');
  btn.disabled = true;
  btn.textContent = 'Cancelling\u2026';
  serverWrite(db.ref('bookings/' + id).remove()).then(() => {
    closeModal();
    showNotice('Booking cancelled');
  }).catch(() => {
    btn.disabled = false;
    btn.textContent = 'Cancel booking';
    alert("Couldn't reach the booking server, so the booking was NOT cancelled. Check your connection and try again.");
  });
}

function saveProfile() {
  const name = document.getElementById('name-input').value.trim();
  const errEl = document.getElementById('p-err');
  if (!name) { errEl.textContent = 'Please enter your name.'; return; }
  profile = { ...profile, name };
  store('rb_profile', JSON.stringify(profile));
  store('room208_name', null);
  editingProfile = false;
  renderApp();
}

function editProfile() { editingProfile = true; renderApp(); }
function cancelProfile() { editingProfile = false; renderApp(); }

// \u2500\u2500 Screens \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

function renderSetupScreen() {
  document.getElementById('root').innerHTML = `
  <div class="setup-screen">
    <div class="setup-card">
      <h2>Connect Firebase</h2>
      <p>This app needs a free Firebase Realtime Database so everyone sees live bookings.</p>
      <p class="setup-step"><strong>1.</strong> Create a project at <a href="https://console.firebase.google.com" target="_blank" style="color:var(--green)">console.firebase.google.com</a>.</p>
      <p class="setup-step"><strong>2.</strong> Build \u2192 Realtime Database \u2192 Create database.</p>
      <p class="setup-step"><strong>3.</strong> Project Settings \u2192 Your apps \u2192 Web \u2192 copy the config into <code>FIREBASE_CONFIG</code> in index.html.</p>
    </div>
  </div>`;
}

function renderProfileScreen() {
  const canCancel = editingProfile && profile.name;
  document.getElementById('root').innerHTML = `
  <div class="name-screen">
    <div class="name-card">
      <h2>Welcome to room booking</h2>
      <p>Enter your name so others can see who has booked the room. You'll only need to do this once.</p>
      <label for="name-input">Name</label>
      <input id="name-input" type="text" placeholder="Your name" maxlength="40" value="${esc(profile.name)}" autofocus
        onkeydown="if(event.key==='Enter')saveProfile()" />
      <div id="p-err" class="error" style="margin:-6px 0 8px"></div>
      <button onclick="saveProfile()">Continue</button>
      ${canCancel ? '<button class="secondary" onclick="cancelProfile()">Cancel</button>' : ''}
    </div>
  </div>`;
}

function renderApp() {
  if (!isConfigured()) { renderSetupScreen(); return; }
  if (!profile.name || editingProfile) { renderProfileScreen(); return; }
  document.getElementById('root').innerHTML = `<div class="container" id="main"></div><div id="modal-root"></div>`;
  renderMain();
  renderModal();
}

function renderMain() {
  const main = document.getElementById('main');
  if (!main) return;

  const now = Date.now();
  const dates = getWeekDates(weekOffset);
  const months = [...new Set(dates.map(d => MONTHS[d.getUTCMonth()]))];
  const weekLabel = `${months.join(' / ')} ${dates[0].getUTCFullYear()}`;
  const wkBookings = weekBookings(room, dates);

  let h = `<div class="header">
    <div class="app-title">Meeting rooms</div>
    <div class="header-right">
      <span class="user-pill" onclick="editProfile()" title="Change name">&#128100; ${esc(profile.name)}</span>
      <div class="nav">
        <button onclick="weekOffset--;renderMain()" aria-label="Previous week">&#8592;</button>
        <span class="week-label">${weekLabel}</span>
        <button onclick="weekOffset++;renderMain()" aria-label="Next week">&#8594;</button>
      </div>
    </div>
  </div>
  ${!connected && (everConnected || performance.now() > 5000)
    ? `<div class="banner error-banner">${everConnected
        ? 'Lost connection to the booking server. New bookings won\'t save until it\'s back.'
        : 'Can\'t reach the booking server, so bookings can\'t be seen or saved. Check your internet, VPN or ad blocker, then reload.'}</div>`
    : ''}
  ${notice ? `<div class="banner ok-banner">${esc(notice)}</div>` : ''}
  <div class="rooms">`;

  ROOMS.forEach(r => {
    const s = roomStatus(r, now);
    h += `<button class="room-tab${r === room ? ' active' : ''}" onclick="selectRoom('${r}')">
      <div class="room-tab-top"><span class="status-dot${s.busy ? ' busy' : ''}"></span>Room ${r}</div>
      <div class="room-status" title="${esc(s.text)}">${s.busy ? 'In use \u2014 ' : ''}${esc(s.text)}</div>
    </button>`;
  });

  h += `</div>
  <div class="calendar">
    <div class="cal-head"><div class="cal-head-cell"></div>`;

  dates.forEach((d, i) => {
    const tod = isToday(d) ? ' today' : '';
    h += `<div class="cal-head-cell${tod}"><span class="dn">${d.getUTCDate()}</span>${DAYS[i]}</div>`;
  });

  // Label each half hour; the :15/:45 rows get a hidden divider so the grid reads in half hours.
  const qtr = si => (si % 2 === 0 ? ' qtr' : '');
  h += `</div><div class="cal-body"><div class="time-col">`;
  for (let si = 0; si < SLOTS; si++) h += `<div class="time-cell${qtr(si)}">${si % 2 === 0 ? LABELS[si] : ''}</div>`;
  h += `</div>`;

  for (let d = 0; d < 5; d++) {
    h += `<div class="day-col">`;
    const dayBookings = wkBookings.filter(b => b.col === d);
    for (let si = 0; si < SLOTS; si++) {
      const s0 = slotTime(dates[d], si), s1 = slotTime(dates[d], si + 1);
      const booked = dayBookings.some(b => b.startAt < s1 && b.endAt > s0);
      h += `<div class="slot${qtr(si)}${booked ? ' booked' : ''}" ${!booked ? `onclick="openNew(${d},${si})"` : ''}></div>`;
    }
    dayBookings.forEach(b => {
      const c = colorFor(b.organizer);
      const startS = Math.max(0, (minsOfDay(b.startAt) - DAY_START) / STEP);
      const endS = Math.min(SLOTS, (minsOfDay(b.endAt) - DAY_START) / STEP);
      if (endS <= startS) return;
      const height = (endS - startS) * SLOT_H - 2;
      const short = endS - startS <= 1;   // 15 min: one line only
      const cls = (short ? ' short' : '') + (b.endAt < now ? ' past' : '');
      const tip = `${b.title} \u2014 booked by ${b.organizer || 'unknown'}, ${timeRange(b)}`;
      h += `<div class="booking${cls}" title="${esc(tip)}" style="top:${startS * SLOT_H}px;height:${height}px;background:${c.bg};border:1px solid ${c.border};color:${c.text}" onclick="openView('${b.id}')">
        <div class="booking-title">${esc(b.title)}${short ? ` \u00b7 ${esc(b.organizer || '')}` : ''}</div>
        ${short ? '' : `<div class="booking-meta">${esc(b.organizer || '\u2014')} \u00b7 ${timeRange(b)}</div>`}
      </div>`;
    });
    if (isToday(dates[d])) {
      const mins = minsOfDay(now) - DAY_START;
      if (mins >= 0 && mins <= DAY_END - DAY_START) {
        h += `<div class="now-line" style="top:${(mins / STEP) * SLOT_H}px"></div>`;
      }
    }
    h += `</div>`;
  }

  h += `</div></div>
  <div class="legend">
    <span><span class="legend-dot"></span>Click any empty slot to book</span>
    <span>All times are Pacific (Santa Clara)</span>
  </div>`;

  main.innerHTML = h;
}

function renderModal() {
  const el = document.getElementById('modal-root');
  if (!el) return;
  let h = '';

  if (modal?.type === 'new') {
    const startOpts = LABELS.slice(0, SLOTS).map((t, i) => `<option value="${i}" ${i === modal.startSlot ? 'selected' : ''}>${t}</option>`).join('');
    const endOpts = LABELS.map((t, i) => i === 0 ? '' : `<option value="${i}" ${i === modal.endSlot ? 'selected' : ''}>${t}</option>`).join('');
    h = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>Book Room ${room}</h3>
        <div class="field"><label>Meeting title</label><input id="m-title" type="text" placeholder="e.g. Team sync" maxlength="80" autofocus
          onkeydown="if(event.key==='Enter')confirmBooking()" /></div>
        <div class="field" style="font-size:13px;color:var(--text-secondary)">Booking as <strong style="color:var(--text)">${esc(profile.name)}</strong></div>
        <div class="two-col">
          <div class="field"><label>Start</label><select id="m-start">${startOpts}</select></div>
          <div class="field"><label>End</label><select id="m-end">${endOpts}</select></div>
        </div>
        <div id="m-err" class="error"></div>
        <div class="modal-actions">
          <button onclick="closeModal()">Cancel</button>
          <button id="m-book" class="btn-confirm" onclick="confirmBooking()">Book room</button>
        </div>
      </div>
    </div>`;
  } else if (modal?.type === 'view') {
    const b = bookings[modal.id];
    if (!b) {
      modal = null;
    } else {
      const c = colorFor(b.organizer);
      const own = isOwn(b);
      const fromGcal = b.source === 'gcal';   // imported from the room's Google Calendar
      const dayDate = new Date(b.startAt).toLocaleDateString([], { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
      h = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <h3>${esc(b.title)}</h3>
          ${own ? '<div class="own-badge">Your booking</div>' : ''}
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <span style="background:${c.bg};color:${c.text};border:1px solid ${c.border};border-radius:4px;padding:3px 10px;font-size:12px;">${timeRange(b)}</span>
            <span style="font-size:13px;color:var(--text-secondary);">Room ${esc(b.room)} \u00b7 ${dayDate}</span>
          </div>
          <div class="detail">Booked by: <span>${esc(b.organizer || '\u2014')}</span></div>
          ${fromGcal ? '<div class="detail">Booked in Google Calendar. To change or cancel it, edit the event there.</div>' : ''}
          <div class="modal-actions">
            ${own && !fromGcal ? `<button id="m-delete" class="btn-delete" onclick="deleteBooking('${modal.id}')">Cancel booking</button>` : ''}
            <button onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>`;
    }
  }

  el.innerHTML = h;
}

// \u2500\u2500 Boot \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
Object.assign(window, {
  openNew, openView, closeModal, confirmBooking, deleteBooking,
  saveProfile, editProfile, cancelProfile, selectRoom, renderMain,
});

if (isConfigured()) {
  initFirebase();
  renderApp();
  setInterval(renderMain, 30000);   // keep "now" status and time line current
} else {
  renderSetupScreen();
}
</script>
</body>
</html>
